<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shadows of Desire Contest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #110202;
            --bg-end: #2c0202;
            --primary: #f43f5e;
            --accent: #eab308;
            --text-dim: #9ca3af;
            --border: rgba(180, 0, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: #fff;
            font-family: 'Cinzel', 'Georgia', serif;
            padding: 12px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 13px;
            display: flex;
            flex-direction: column;
        }
        .header {
            border-bottom: 2px solid #800;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-align: center;
        }
        .title {
            color: var(--primary);
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.5);
            margin: 0 0 4px 0;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #ffa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            font-weight: 400;
        }
        .info-bar {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .badge {
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
        }
        .badge-open { background: #16a34a; }
        .badge-closed { background: #dc2626; }
        .badge-choosing { background: var(--accent); color: #000; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .content-area { flex: 1; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        tr { border-bottom: 1px solid var(--border); }
        td { padding: 5px 4px; font-size: 13px; }
        .name-cell { color: #fca5a5; font-weight: bold; }
        .legacy-cell { color: var(--text-dim); text-align: right; font-style: italic; }
        .winner-box {
            text-align: center; padding: 20px;
            border: 2px solid gold; background: rgba(20,0,0,0.9);
            border-radius: 10px; margin: 15px 0;
            animation: glow 2s infinite;
        }
        @keyframes glow {
            0%,100% { box-shadow: 0 0 15px rgba(255,215,0,0.3); }
            50% { box-shadow: 0 0 30px rgba(255,215,0,0.6); }
        }
        .winner-label { color: var(--accent); font-size: 15px; font-weight: bold; margin-bottom: 6px; }
        .winner-name { color: #fff; font-size: 20px; font-weight: bold; margin: 8px 0; }
        .winner-legacy { color: #aaa; font-size: 12px; }
        .choosing { text-align: center; padding: 50px 10px; }
        .choosing h2 { color: var(--accent); font-size: 22px; } /* Cambiado a dorado */
        .choosing p { color: #fef9c3; font-style: italic; font-size: 14px; } /* dorado claro */
        .empty { color: #a1a1aa; font-style: italic; text-align: center; margin-top: 50px; line-height: 1.6; font-size: 13px; }
        .pagination {
            display: flex; justify-content: space-between; margin-top: 8px;
            font-size: 11px; color: #fca5a5; background: rgba(0,0,0,0.5);
            padding: 4px 8px; border-radius: 4px;
        }
        .history {
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 8px;
        }
        .history-title {
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .history-item {
            background: rgba(0,0,0,0.5);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: #ddd;
        }
        #main-area { min-height: 200px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Shadows of Desire Contest</div>
        <div class="subtitle" id="topic-display">📋 TOPIC: ...</div>
    </div>
    <div class="info-bar">
        <div>⏱️ Time: <span style="color:#f88;font-weight:bold;" id="time-display">--:--</span></div>
        <div id="badge-container"></div>
    </div>
    <div class="content-area" id="main-area"></div>
    <div class="pagination" id="pagination-bar"></div>
    <div class="history" id="history-section"></div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            function g(name, fallback) { return urlParams.get(name) || fallback || ''; }

            const estado = g('estado', 'CLOSED');
            const tema = g('tema', 'No topic');
            let segundosRestantes = parseInt(g('tseg', '0')) || 0;
            const ganador = g('ganador');
            const legacy = g('legacy');
            const total = parseInt(g('total', '0')) || 0;
            const pagina = g('pag', '1');
            const maxPag = g('maxpag', '1');
            const numMostrados = parseInt(g('num', '0')) || 0;
            const hwcount = parseInt(g('hwcount', '0')) || 0;

            document.getElementById('topic-display').innerHTML = '📋 TOPIC: ' + tema;

            function formatTime(secs) {
                if (secs <= 0) return 'Time ended';
                const min = Math.floor(secs / 60);
                const seg = secs % 60;
                return min + ':' + (seg < 10 ? '0' : '') + seg + ' left';
            }

            function updateTimeDisplay() {
                const timeEl = document.getElementById('time-display');
                if (estado === 'OPEN' && segundosRestantes > 0) {
                    timeEl.textContent = formatTime(segundosRestantes);
                } else if (estado === 'OPEN' && segundosRestantes <= 0) {
                    timeEl.textContent = 'Time ended';
                } else {
                    timeEl.textContent = 'CLOSED';
                }
            }
            updateTimeDisplay();

            const badge = document.getElementById('badge-container');
            if (estado === 'OPEN') badge.innerHTML = '<span class="badge badge-open">OPEN</span>';
            else if (estado === 'CHOOSING') badge.innerHTML = '<span class="badge badge-choosing">CHOOSING</span>';
            else badge.innerHTML = '<span class="badge badge-closed">CLOSED</span>';

            const main = document.getElementById('main-area');
            let html = '';
            if (estado === 'WINNER' && ganador) {
                html = `<div class="winner-box">
                    <div class="winner-label">🏆 GANADOR/A - WINNER 🏆</div>
                    <div class="winner-name">${ganador}</div>
                    <div class="winner-legacy">@${legacy || '---'}</div>
                </div>`;
            } else if (estado === 'CHOOSING') {
                html = `<div class="choosing">
                    <h2>🎲 Eligiendo ganador... / Choosing winner...</h2>
                    <p>choosing winner</p>
                </div>`;
            } else {
                if (total === 0) {
                    html = `<div class="empty">
                        <p>No hay concursantes aún. / No contestants yet.</p>
                        <p>¡Sé el primero! / Be the first!</p>
                    </div>`;
                } else {
                    html = '<table>';
                    for (let i = 0; i < numMostrados; i++) {
                        const nombre = g('c' + i);
                        const leg = g('l' + i);
                        if (nombre) {
                            html += `<tr>
                                <td class="name-cell">${i+1}. ${nombre}</td>
                                <td class="legacy-cell">@${leg || nombre}</td>
                            </tr>`;
                        }
                    }
                    html += '</table>';
                }
            }
            main.innerHTML = html;

            document.getElementById('pagination-bar').innerHTML = total > 0
                ? `<span>Page ${pagina}/${maxPag} (${total})</span><span>Use physical buttons</span>`
                : `<span>No contestants</span>`;

            const historyDiv = document.getElementById('history-section');
            if (hwcount > 0) {
                let histHtml = '<div class="history-title">🏅 Recent Winners / Ganadores Recientes</div><div class="history-list">';
                for (let i = 0; i < hwcount; i++) {
                    const name = g('hw' + i);
                    if (name) histHtml += `<span class="history-item">${name}</span>`;
                }
                histHtml += '</div>';
                historyDiv.innerHTML = histHtml;
            } else {
                historyDiv.innerHTML = '';
            }

            if (estado === 'OPEN' && segundosRestantes > 0) {
                setInterval(function() {
                    segundosRestantes--;
                    if (segundosRestantes <= 0) segundosRestantes = 0;
                    updateTimeDisplay();
                }, 1000);
            }
        })();
    </script>
</body>
</html>
